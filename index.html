<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escáner</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 10px;
  background: #f5f5f5;
}
#reader {
  width: 100%;
  max-width: 400px;
  margin: auto;
}
.fila {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-top: 12px;
}
input {
  width: 65%;
  font-size: 20px;
  padding: 10px;
}
button {
  font-size: 20px;
  padding: 10px 14px;
}
#res {
  margin: 15px auto 0;
  padding: 20px;
  color: white;
  font-size: 22px;
  font-weight: bold;
  display: none;
  max-width: 400px;
  border-radius: 12px;
}
.ok { background: green; }
.repetido { background: red; }
.no { background: orange; }
.error { background: #666; }
.detalle {
  font-size: 17px;
  font-weight: normal;
  margin-top: 8px;
  line-height: 1.3;
}
</style>
</head>

<body>

<div id="reader"></div>

<div class="fila">
  <input id="dni" placeholder="DNI">
  <button onclick="manual()">OK</button>
</div>

<div id="res"></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzEnODMs4xwkCmpLQUlga86M-DieCcAOrriSsHHWGQ2hQKCN904gIYmFINGtBiiZo9F9g/exec?formato=json";

let bloqueado = false;
let ultimoCodigo = "";
let ultimoTiempo = 0;

function extraerDni(valor) {
  const texto = (valor || "").trim();

  // Si el QR trae link completo con ?dni=
  try {
    const url = new URL(texto);
    const dniUrl = url.searchParams.get("dni");
    if (dniUrl) return dniUrl.trim();
  } catch (e) {
    // No era URL, seguimos
  }

  // Si el QR trae solo DNI
  return texto;
}

function mostrar(data, clase) {
  let box = document.getElementById("res");
  box.style.display = "block";
  box.className = clase;

  box.innerHTML = `
    <div>${data.titulo || "SIN RESPUESTA"}</div>
    <div class="detalle">${data.nombre || ""}</div>
    <div class="detalle">DNI: ${data.dni || ""}</div>
    <div class="detalle">${data.detalle || ""}</div>
    <div class="detalle">Ingresados: ${data.totalIngresados ?? ""} / ${data.totalRegistrados ?? ""}</div>
  `;
}

async function validar(valorLeido) {
  if (!valorLeido || bloqueado) return;

  const ahora = Date.now();
  if (valorLeido === ultimoCodigo && (ahora - ultimoTiempo) < 2000) {
    return;
  }

  ultimoCodigo = valorLeido;
  ultimoTiempo = ahora;

  const dni = extraerDni(valorLeido);

  if (!dni) {
    mostrar({
      titulo: "QR INVÁLIDO",
      nombre: "",
      dni: "",
      detalle: "No se pudo obtener el DNI.",
      totalIngresados: "",
      totalRegistrados: ""
    }, "error");
    return;
  }

  bloqueado = true;

  try {
    let r = await fetch(API + "&dni=" + encodeURIComponent(dni));
    let texto = await r.text();

    let d;
    try {
      d = JSON.parse(texto);
    } catch (e) {
      mostrar({
        titulo: "ERROR DE RESPUESTA",
        nombre: "",
        dni: dni,
        detalle: "El Apps Script no devolvió JSON válido.",
        totalIngresados: "",
        totalRegistrados: ""
      }, "error");
      bloqueado = false;
      return;
    }

    if (d.estado === "ok") mostrar(d, "ok");
    else if (d.estado === "repetido") mostrar(d, "repetido");
    else if (d.estado === "no_encontrado") mostrar(d, "no");
    else {
      mostrar({
        titulo: "RESPUESTA DESCONOCIDA",
        nombre: "",
        dni: dni,
        detalle: "El script respondió algo inesperado.",
        totalIngresados: "",
        totalRegistrados: ""
      }, "error");
    }

  } catch (e) {
    mostrar({
      titulo: "ERROR DE CONEXIÓN",
      nombre: "",
      dni: dni,
      detalle: "No se pudo conectar con Apps Script.",
      totalIngresados: "",
      totalRegistrados: ""
    }, "error");
  }

  setTimeout(() => {
    bloqueado = false;
  }, 1800);
}

function manual() {
  let dni = document.getElementById("dni").value.trim();
  validar(dni);
  document.getElementById("dni").value = "";
}

function scanSuccess(text) {
  validar(text);
}

new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 }).render(scanSuccess);
</script>

</body>
</html>
