<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escáner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
      background: #f5f5f5;
    }

    #res {
      position: sticky;
      top: 0;
      z-index: 999;
      margin: 0 auto 10px;
      padding: 14px;
      color: white;
      font-size: 24px;
      font-weight: bold;
      display: none;
      width: 95%;
      max-width: 420px;
      border-radius: 12px;
      box-sizing: border-box;
    }

    .ok { background: #188038; }
    .repetido { background: #d93025; }
    .no { background: #f29900; }
    .error { background: #666; }

    .detalle {
      font-size: 18px;
      margin-top: 6px;
      font-weight: normal;
      line-height: 1.2;
    }

    #reader {
      width: 100%;
      max-width: 240px;
      margin: 8px auto;
    }

    .fila {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    input {
      width: 65%;
      max-width: 220px;
      font-size: 20px;
      padding: 10px;
      box-sizing: border-box;
    }

    button {
      font-size: 20px;
      padding: 10px 14px;
      cursor: pointer;
    }

    #debug {
      margin-top: 6px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>

<body>

  <div id="res"></div>

  <div id="reader"></div>

  <div id="debug">Esperando QR...</div>

  <div class="fila">
    <input id="dni" placeholder="DNI">
    <button onclick="manual()">OK</button>
  </div>

  <script>
    const API = "https://script.google.com/macros/s/AKfycby4Cqm2beoseskyYse9qWd2mRRCe0RfjvpnSlpXiksqqmqZfBAXS76k_Y9orI6eCrCsbA/exec?formato=json";

    let bloqueado = false;
    let ultimoCodigo = "";
    let ultimoTiempo = 0;
    const TIEMPO_BLOQUEO = 2200;
    const TIEMPO_MISMO_QR = 4000;

    function debug(txt) {
      document.getElementById("debug").textContent = txt;
    }

    function mostrar(data, clase) {
      let box = document.getElementById("res");
      box.style.display = "block";
      box.className = clase;

      box.innerHTML = `
        <div>${data.titulo || "SIN RESPUESTA"}</div>
        <div class="detalle">${data.nombre || ""}</div>
        <div class="detalle">DNI: ${data.dni || ""}</div>
      `;
    }

    function limpiarResultado() {
      const box = document.getElementById("res");
      box.style.display = "none";
      box.innerHTML = "";
    }

    async function validar(dni) {
      if (!dni) return;

      dni = dni.trim();
      const ahora = Date.now();

      if (bloqueado) {
        return;
      }

      if (dni === ultimoCodigo && (ahora - ultimoTiempo) < TIEMPO_MISMO_QR) {
        debug("Mismo QR ignorado");
        return;
      }

      bloqueado = true;
      ultimoCodigo = dni;
      ultimoTiempo = ahora;

      debug("Validando: " + dni);

      try {
        const r = await fetch(API + "&dni=" + encodeURIComponent(dni), {
          method: "GET",
          cache: "no-store"
        });

        const d = await r.json();

        if (d.estado === "ok") mostrar(d, "ok");
        else if (d.estado === "repetido") mostrar(d, "repetido");
        else if (d.estado === "no_encontrado") mostrar(d, "no");
        else mostrar({ titulo: "ERROR", nombre: "", dni: dni }, "error");

        debug("Listo");

      } catch (e) {
        mostrar({
          titulo: "ERROR DE CONEXIÓN",
          nombre: "",
          dni: dni
        }, "error");

        debug("Error conexión");
      }

      setTimeout(() => {
        bloqueado = false;
        limpiarResultado();
        debug("Esperando QR...");
      }, TIEMPO_BLOQUEO);
    }

    function manual() {
      let dni = document.getElementById("dni").value.trim();
      if (!dni) return;
      validar(dni);
      document.getElementById("dni").value = "";
    }

    function scanSuccess(text) {
      validar(text.trim());
    }

    new Html5QrcodeScanner(
      "reader",
      {
        fps: 6,
        qrbox: 170,
        rememberLastUsedCamera: true
      },
      false
    ).render(scanSuccess);
  </script>

</body>
</html>
