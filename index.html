<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escáner</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 10px;
  background: #f5f5f5;
}

#res {
  position: sticky;
  top: 0;
  z-index: 999;
  margin: 0 auto 10px;
  padding: 16px;
  color: white;
  font-size: 22px;
  font-weight: bold;
  display: none;
  width: 95%;
  max-width: 420px;
  border-radius: 12px;
}

.ok { background: #188038; }
.repetido { background: #d93025; }
.no { background: #f29900; }
.error { background: #666; }

.detalle {
  font-size: 17px;
  margin-top: 6px;
}

#reader {
  width: 100%;
  max-width: 260px;
  margin: 10px auto;
}

.fila {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-top: 12px;
}

input {
  width: 65%;
  max-width: 220px;
  font-size: 20px;
  padding: 10px;
}

button {
  font-size: 20px;
  padding: 10px 14px;
}

#debug {
  margin-top: 8px;
  font-size: 13px;
  color: #444;
}
</style>
</head>

<body>

<div id="res"></div>

<div id="reader"></div>

<div id="debug">Esperando QR...</div>

<div class="fila">
  <input id="dni" placeholder="DNI">
  <button onclick="manual()">OK</button>
</div>

<script>
const API = "https://script.googleusercontent.com/macros/echo?user_content_key=AWDtjMWj4snQTpjS7dVdb_8WhBqrRYsr0pQXTqL_CM3hQfYoZY34x0sQlavaxl-_2HPn1ULsgqPtz-Wb1c0lBZb7NZcWBRuDJanxmKzmSwTfOaoct0Xd2RSOfVlHYcfFuQ9nA1FNm8UTcTcucPN_ACi-ZgsUEvn8woKp0-JNW6NljyNAsSN3HHn8UX62wmio5t7li8xmiEE0a4HHPqHdKt3W2GTY2FSwraFD-wmTL4RL4MxrJOR1bAsMO-ydn4bx6scG4GvVCXmQPpHnYEn-iEndX9hFMkmmPb62SQAtb_s0yx6KgBVm4sUXrTio5LaTTw&lib=MtJ3sSf_SeA7FFvmlMplDGdvxmZOJkMC1&formato=json";

let bloqueado = false;
let ultimoCodigo = "";
let ultimoTiempo = 0;
let contador = 0;

function debug(txt){
  document.getElementById("debug").textContent = txt;
}

function mostrar(data, clase) {
  let box = document.getElementById("res");
  box.style.display = "block";
  box.className = clase;

  box.innerHTML = `
    <div>${data.titulo}</div>
    <div class="detalle">${data.nombre}</div>
    <div class="detalle">DNI: ${data.dni}</div>
  `;
}

function jsonp(dni){
  return new Promise((resolve, reject) => {
    const cb = "cb_" + (++contador);

    window[cb] = function(data){
      resolve(data);
      delete window[cb];
      script.remove();
    };

    const script = document.createElement("script");
    script.src = API + "&dni=" + dni + "&callback=" + cb;

    script.onerror = function(){
      reject();
      delete window[cb];
      script.remove();
    };

    document.body.appendChild(script);
  });
}

async function validar(dni){
  if(!dni) return;

  const ahora = Date.now();

  if (bloqueado && dni === ultimoCodigo && (ahora - ultimoTiempo) < 2000){
    return;
  }

  bloqueado = true;
  ultimoCodigo = dni;
  ultimoTiempo = ahora;

  debug("Validando: " + dni);

  try{
    const d = await jsonp(dni);

    if(d.estado === "ok") mostrar(d,"ok");
    else if(d.estado === "repetido") mostrar(d,"repetido");
    else if(d.estado === "no_encontrado") mostrar(d,"no");
    else mostrar(d,"error");

  }catch(e){
    mostrar({titulo:"ERROR",nombre:"",dni:""}, "error");
    debug("Error conexión");
  }

  setTimeout(()=>{ bloqueado=false; },1500);
}

function manual(){
  let dni = document.getElementById("dni").value.trim();
  validar(dni);
  document.getElementById("dni").value="";
}

function scanSuccess(text){
  debug("QR: " + text);
  validar(text.trim());
}

new Html5QrcodeScanner("reader", {
  fps: 8,
  qrbox: 180
}).render(scanSuccess);
</script>

</body>
</html>
